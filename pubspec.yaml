name: appchatdemo
description: "A Vietnamese real-time chat app built with Flutter and Riverpod."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 17.1.0
  dio: 5.11.1
  flutter_secure_storage: 9.2.4
  shared_preferences: 2.5.6
  drift: 2.35.0
  drift_flutter: 0.3.1
  uuid: 4.6.0
  record: 7.1.2
  just_audio: 0.10.6
  path_provider: 2.1.6
  speech_to_text: 7.5.0
  file_picker: 10.3.10
  open_filex: 4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: 2.4.2


flutter:
  uses-material-design: true
